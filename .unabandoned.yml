schema: 1

package: "@unabandoned/grunt-zip"

upstream:
  repo: twolfson/grunt-zip
  reason: "no release since 1.0.0 in November 2023; the repository has had no commits since"

summary: >-
  Grunt tasks to zip and unzip files, with per-file routing and skipping,
  DEFLATE compression and preservation of UNIX permissions and symlinks on
  extraction.

why-forked: >-
  CyberChef builds its downloadable standalone zip with it, and it was
  abandoned while carrying runtime dependencies on grunt-retro (a grunt 0.3
  shim frozen since 2022) and an outdated jszip range. The fork drops
  grunt-retro for the plain grunt 1.x API, tracks current jszip, and keeps
  grunt as a peer.

used-by:
  - consumer: TheTechNetwork/CyberChef
    purpose: >-
      packages the production web build into the downloadable standalone
      archive (zip:standalone in Gruntfile.js, run by `grunt prod`), with cwd
      build/prod/ and negated globs excluding index.html and the bundle report

status: active

tags: [grunt, gruntplugin, zip, archive, build]
